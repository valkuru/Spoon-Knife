<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Online Shopping</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        header {
            background: #232f3e;
            color: white;
            padding: 25px;
        }

        .container {
            padding: 50px 20px;
        }

        .product {
            display: inline-block;
            background: white;
            padding: 25px;
            margin: 15px;
            border-radius: 10px;
        }

        button {
            background: #ff9900;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>ShopEase</h1>
       <p>Your Trusted Online Shopping Destination</p>
    </header>

    <div class="container">
        <h2>Welcome to ShopEase!</h2>
        <p>Discover amazing products at great prices.</p>

        <div class="product">
            <h3>Laptop</h3>
            <p>Price: ₹55,000</p>
            <button>Shop Now</button>
        </div>

        <div class="product">
            <h3>Headphones</h3>
            <p>Price: ₹1,500</p>
            <button>Shop Now</button>
        </div>
    </div>

</body>
</html>
