 
name: Deploy Demo to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::577500259878:role/ShopEase-GitHub-SSM-Deploy-Policy
          aws-region: us-east-1

      - name: Send demo deployment command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-058836e3610eda2c0" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo GitHub Actions deployment successful > /tmp/github-actions-demo.txt","cat /tmp/github-actions-demo.txt"]' \
            --comment "GitHub Actions demo deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-058836e3610eda2c0" \
              --query "Status" \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-058836e3610eda2c0" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "SSM deployment failed: $STATUS"
              exit 1
            fi

            sleep 5
          done

          echo "SSM command timed out"
          exit 1

